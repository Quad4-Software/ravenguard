name: Docker

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/test-docs.yml"
  pull_request:
    branches:
      - master
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/admin/**"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }}
    if: >
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'nightly'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (lowercase)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GHCR requires lowercase repository names.
          echo "name=${REPO,,}" >> "${GITHUB_OUTPUT}"

      - name: Decide push
        id: push
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          push=false
          if [[ "${REPO}" == "Quad4-Software/ravenguard" ]]; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              push=true
            elif [[ "${EVENT_NAME}" == "push" ]]; then
              if [[ "${REF}" == "refs/heads/master" || "${REF}" == refs/tags/v* ]]; then
                push=true
              fi
            fi
          fi
          echo "push=${push}" >> "${GITHUB_OUTPUT}"

      - name: Build timestamp
        id: created
        run: |
          set -euo pipefail
          echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.push.outputs.push == 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=RavenGuard
            org.opencontainers.image.description=HTTP WAF and reverse proxy
            org.opencontainers.image.url=https://github.com/Quad4-Software/ravenguard
            org.opencontainers.image.documentation=https://github.com/Quad4-Software/ravenguard/tree/master/docs
            org.opencontainers.image.licenses=0BSD
            org.opencontainers.image.vendor=Quad4 Software
            org.opencontainers.image.base.name=gcr.io/distroless/static-debian12:nonroot

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ steps.push.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.push.outputs.push == 'true' }}
          load: ${{ steps.push.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance/SBOM attestations require a registry push (incompatible with --load).
          provenance: ${{ steps.push.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.push.outputs.push == 'true' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.created.outputs.value }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ravenguard-docker
          cache-to: type=gha,mode=max,scope=ravenguard-docker

      - name: Verify nonroot image config
        if: steps.push.outputs.push != 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # metadata may emit multiple tags (newline-separated). Use the first.
          tag="$(printf '%s\n' "${IMAGE_REF}" | head -n1)"
          user="$(docker image inspect "${tag}" --format '{{.Config.User}}')"
          if [[ "${user}" != "65532:65532" && "${user}" != "65532" && "${user}" != "nonroot:nonroot" && "${user}" != "nonroot" ]]; then
            echo "expected nonroot user, got: ${user}" >&2
            exit 1
          fi
          labels="$(docker image inspect "${tag}" --format '{{json .Config.Labels}}')"
          echo "${labels}" | grep -F 'org.opencontainers.image.title'
          echo "${labels}" | grep -F 'org.opencontainers.image.licenses'
          echo "user=${user}"

      - name: Attest container image
        if: steps.push.outputs.push == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: steps.push.outputs.push == 'true' && steps.build.outputs.digest != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: steps.push.outputs.push == 'true' && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
