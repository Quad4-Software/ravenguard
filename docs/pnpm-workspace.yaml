packages:
  - '.'

# Supply chain defaults for pnpm 11+
# https://pnpm.io/supply-chain-security
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Skip trust checks for packages published over a year ago (pre-provenance era).
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
strictDepBuilds: true
trustLockfile: false
dangerouslyAllowAllBuilds: false

# Force patched transitive deps pulled by Docusaurus tooling.
overrides:
  uuid: ^14.0.0
  serialize-javascript: ^7.0.5
  fastq: 1.20.3

minimumReleaseAgeExclude:
  - uuid
  - serialize-javascript
  - fastq

# Explicit lifecycle script allowlist only.
allowBuilds:
  '@swc/core': true
  core-js: false
