# E2E: attack + stub captcha.
[listen]
http = ":18082"

[tls]
mode = "off"

[upstream]
url = "http://127.0.0.1:18000"
connect_timeout = "2s"
response_header_timeout = "10s"

[trust]
mode = "edge"

[blocklists]
ip_files = []
dns_files = []
ua_files = []

[ratelimit]
enabled = false

[protect]
enabled = false

[detect]
enabled = false

[challenge]
enabled = true
mode = "attack"
algorithm = "sha256"
difficulty = 8
env_probe = "off"
cookie_name = "rg_clear"
cookie_ttl = "1h"
secret = "e2e-challenge-secret!!"
path_prefix = "/_rg"

[challenge.captcha]
enabled = true
provider = "stub"
token = "ok"

[privacy]
hash_client_ip = false
log_ip = "off"

[ui]
brand = "RavenGuard"
status_text = "Checking your browser before accessing this site."
test_mode = false

[logging]
level = "error"
format = "text"
