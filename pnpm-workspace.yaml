packages:
  - 'packages/widget'
  - 'docs'
  - 'e2e'

# Supply chain defaults for pnpm 11+
# https://pnpm.io/supply-chain-security
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
strictDepBuilds: true
trustLockfile: false
dangerouslyAllowAllBuilds: false

overrides:
  uuid: ^14.0.0
  serialize-javascript: ^7.0.5
  qs: ^6.16.0
  cookie: ^0.7.2
  esbuild: ^0.28.2
  image-size: npm:image-size-next@2.1.1
  fastq: 1.20.3
  js-yaml: ^4.3.2
  # GHSA: tinypool 1.x pulled by @docusaurus/core. Pin to the fixed line.
  tinypool: ^2.1.2
  # GHSA: postcss-selector-parser <7.1.6 pulled by cssnano plugins.
  postcss-selector-parser: ^7.1.6
  vitest: ^5.0.1
  # GHSA: fast-uri 3.1.6 pulled by ajv -> docusaurus. Pin to the fixed line.
  fast-uri: ^3.1.8
  # @vercel/oidc 3.8.x lost trusted-publisher evidence (pnpm trustPolicy
  # blocks it). 3.7.1 is the last release with provenance.
  "@vercel/oidc": "3.7.1"
  webpack-dev-middleware: 7.4.5

minimumReleaseAgeExclude:
  - uuid
  - serialize-javascript
  - qs
  - image-size-next
  - fastq

allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
