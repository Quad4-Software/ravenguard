{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.PageTitle}}</title>
<meta name="description" content="{{.Description}}">
<meta name="robots" content="{{.Robots}}">
<meta name="theme-color" content="{{.ThemeColor}}">
<meta name="color-scheme" content="dark">
{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}">{{end}}
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="{{.Prefix}}/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{.Prefix}}/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{.Prefix}}/static/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="{{.Prefix}}/static/apple-touch-icon.png">
<link rel="manifest" href="{{.Prefix}}/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{.Brand}}">
<meta property="og:title" content="{{.PageTitle}}">
<meta property="og:description" content="{{.Description}}">
{{if .OGImage}}<meta property="og:image" content="{{.OGImage}}">{{end}}
{{if .Canonical}}<meta property="og:url" content="{{.Canonical}}">{{end}}
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{.PageTitle}}">
<meta name="twitter:description" content="{{.Description}}">
{{if .OGImage}}<meta name="twitter:image" content="{{.OGImage}}">{{end}}
<link rel="stylesheet" href="{{.Prefix}}/static/challenge.css">
{{end}}
