<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  <main class="wrap">
    <p class="code">{{.ChallengeTitle}}</p>
    <p class="status" id="status">{{.StatusText}}</p>
    <p class="sub" id="sub">{{.ChallengeSubtitle}}</p>
    <div class="widget">
      {{.WidgetHTML}}
    </div>
    {{if .CaptchaEnabled}}
    <label class="captcha" for="captcha">Confirm
      <input id="captcha" name="captcha" type="text" autocomplete="off" placeholder="type ok">
    </label>
    {{end}}
    <p class="ray">{{.RayLabel}}: <span id="ray">{{.RayID}}</span></p>
    {{if .PrivacyNoticeURL}}
    <p class="sub"><a href="{{.PrivacyNoticeURL}}">Privacy notice</a></p>
    {{end}}
  </main>
  <footer>
    {{if .ShowBrandMark}}<img class="raven" src="{{.LogoURL}}" alt="{{.Brand}}">{{end}}
    <span>{{.FooterText}}</span>
  </footer>
  <script>
    window[{{printf "%q" .BootstrapGlobal}}] = {
      prefix: {{printf "%q" .Prefix}},
      ray: {{printf "%q" .RayID}},
      captcha: {{if .CaptchaEnabled}}true{{else}}false{{end}}
    };
  </script>
  <script src="{{.Prefix}}/static/{{.WidgetJS}}" defer></script>
  <script src="{{.Prefix}}/static/{{.ChallengeJS}}" defer></script>
</body>
</html>
