<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  <main class="wrap">
    <p class="code">{{.Code}}</p>
    <p class="status">{{.Title}}</p>
    {{if .Detail}}<p class="sub">{{.Detail}}</p>{{end}}
    {{if .RequestID}}<p class="rid">{{.RequestIDLabel}}: <span>{{.RequestID}}</span></p>{{end}}
    {{if .Contact}}
    <p class="sub">{{if .ContactHref}}<a href="{{.ContactHref}}">{{.Contact}}</a>{{else}}{{.Contact}}{{end}}</p>
    {{end}}
  </main>
  <footer>
    {{if .ShowBrandMark}}<img class="raven" src="{{.LogoURL}}" alt="{{.Brand}}">{{end}}
    <span>{{.FooterText}}</span>
  </footer>
</body>
</html>
