<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  <main class="wrap">
    <p class="code">{{.Code}}</p>
    <p class="status">{{.Title}}</p>
    {{if .Detail}}<p class="sub">{{.Detail}}</p>{{end}}
    <p class="ray">{{.RayLabel}}: <span>{{.RayID}}</span></p>
  </main>
  <footer>
    {{if .ShowBrandMark}}<img class="raven" src="{{.LogoURL}}" alt="{{.Brand}}">{{end}}
    <span>{{.FooterText}}</span>
  </footer>
</body>
</html>
